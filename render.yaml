services:
  - type: web
    name: fatscope-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAX_UPLOAD_MB
        value: "512"
      - key: DATA_DIR
        value: /data
      - key: ANALYSIS_TTL_HOURS
        value: "24"
    disk:
      name: fatscope-evidence
      mountPath: /data
      sizeGB: 10
