[project]
name = "fatscope-backend"
version = "1.0.0"
description = "Read-only FAT32 forensic analysis backend"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["."]
exclude = [".venv", "data", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RET", "ARG", "N", "W"]
ignore = ["B008", "SIM108", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
